name: Release

on:
  push:
    branches: [develop, master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/regression.yml

  publish:
    name: publish ${{ github.ref_name }} release
    needs: regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version, tag and channel
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = (python tools/version.py show).Trim()
          if ("${{ github.ref_name }}" -eq "develop") {
            # The source version must be the *next* stable version: refuse to
            # publish a dev build whose base already is the latest stable.
            $latest = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>$null
            if ($LASTEXITCODE -eq 0 -and $latest -eq "v$base") {
              throw "version $base is already the Latest stable release; bump the version before pushing develop"
            }
            $display = (python tools/dev_version.py).Trim()
            $build = ($display -split '-dev\.')[1]
            $channel = "development"
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            $display = $base
            $build = "0"
            $channel = "stable"
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "display=$display" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "tag=v$display" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          Write-Host "version=$display tag=v$display channel=$channel"

      - name: Skip when the release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $exists = $false
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if ($exists) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "release $tag already exists; skipping"
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Build tar.gz and setup.exe
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          VELA_BUILD_NUMBER: ${{ steps.meta.outputs.build }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Version "${{ steps.meta.outputs.display }}" -OutDir dist
          Get-ChildItem dist | Select-Object Name, Length

      - name: Write release notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $display = "${{ steps.meta.outputs.display }}"
          $channel = "${{ steps.meta.outputs.channel }}"
          $lines = @(
            "## Vela $display",
            "",
            "Automated **$channel** build from branch ``${{ github.ref_name }}`` at commit ``${{ github.sha }}``.",
            "",
            "### Artifacts",
            "- ``vela-$display-windows-x86_64.tar.gz`` - compiler, examples and docs",
            "- ``vela-$display-setup.exe`` - Windows x86-64 installer (Inno Setup)",
            "- ``*.sha256`` - checksums",
            "",
            "### Benchmark",
            "https://vela.markjy.com/benchmark/",
            "",
            "### Verify",
            '```powershell',
            "python -m unittest discover -s tests",
            "python tests\differential.py",
            '```',
            "",
            "Apache-2.0"
          )
          $lines -join "`n" | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem dist -File |
              Where-Object { $_.Name -like "vela-${{ steps.meta.outputs.display }}-*" } |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -lt 2) {
            throw "expected tar.gz + setup.exe assets, found $($assets.Count)"
          }
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            gh release create "${{ steps.meta.outputs.tag }}" @assets `
              --target "${{ github.sha }}" `
              --title "Vela ${{ steps.meta.outputs.display }}" `
              --notes-file release_notes.md --prerelease
          } else {
            gh release create "${{ steps.meta.outputs.tag }}" @assets `
              --target "${{ github.sha }}" `
              --title "Vela ${{ steps.meta.outputs.display }}" `
              --notes-file release_notes.md --latest
          }

      - name: Prune older dev releases
        if: steps.check.outputs.skip != 'true' && steps.meta.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "${{ steps.meta.outputs.tag }}"
          $tags = gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName'
          foreach ($t in $tags) {
            if ($t -ne $current -and $t -like "*-dev.*") {
              gh release delete "$t" --yes --cleanup-tag
            }
          }

      - name: Sync README version
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          python tools/sync_readme_version.py
          git diff --quiet -- README.md
          if ($LASTEXITCODE -eq 0) {
            Write-Host "README already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 同步 README 版本号 [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
