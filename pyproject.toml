[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vela-lang"
version = "2.0.0"
description = "Vela: a Python-syntax AOT compiler for Windows x86-64 with a from-scratch backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vela contributors" }]
keywords = ["compiler", "python", "windows", "x86-64", "aot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
vela = "vela.cli:main"

[tool.setuptools]
packages = ["vela"]
